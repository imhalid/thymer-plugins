<!doctype html>
<meta charset="utf-8">
<title>Epic unlock - lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
	:root { color-scheme: dark; }
	body { margin: 0; background: radial-gradient(1200px 500px at 50% 0, #1b1f2b, #0d0f14); color: #cfd6e6; font: 13px/1.4 -apple-system, system-ui, sans-serif; min-height: 100vh; }
	#stage { position: relative; width: 1300px; height: 470px; margin: 30px auto 0; }
	canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
	.badge { position: absolute; top: 205px; width: 60px; height: 60px; margin: -0px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: #1a1d27; box-shadow: inset 0 0 0 2px var(--c); transform: scale(var(--s, 1)); }
	.lab { position: absolute; top: 300px; width: 200px; text-align: center; opacity: .6; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
	#ui { width: 1300px; margin: 12px auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
	button { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 8px; background: #252a38; } button:hover { background: #333a4d; }
	input[type=range] { width: 360px; }
</style>
<div id="stage"><canvas id="c"></canvas><div id="badges"></div></div>
<div id="ui"><button id="all">Play all</button><button data-i="0">Easy</button><button data-i="1">Medium</button><button data-i="2">Hard</button><button data-i="3">Legendary</button>
	<label><input type="checkbox" id="loop" checked> loop</label><span style="flex:1"></span><span id="tt">t</span><input type="range" id="sc" min="0" max="45" value="0"></div>
<script>
const TIERS = [
	{ name: 'Easy', sub: 'Bloom', color: '#5ee6a0', icon: '\u{1F331}' }, { name: 'Medium', sub: 'Prism', color: '#4fd8ff', icon: '\u{1F48E}' },
	{ name: 'Hard', sub: 'Eclipse', color: '#b98cff', icon: '\u{1F311}' }, { name: 'Legendary', sub: 'Supernova', color: '#ffb347', icon: '\u{1F451}' },
];
const N = TIERS.length, R = 30, SPACING = 295;
const VERT = `#version 300 es
in vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;
const FRAG = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uDpr; uniform int uN;
uniform vec2 uC[${N}]; uniform float uR[${N}], uT[${N}], uSeed[${N}], uTier[${N}]; uniform vec3 uCol[${N}];
out vec4 o;
// A game-style unlock: made of clean shapes, not noise. A short wind-up, a hit (flash + flare), then a shock ring, a sunburst,
// confetti and sparkles thrown out, a shine across the badge. The tier decides how much of it there is.
const float B = 0.7, TAU = 6.2831853;
float SD = 0.0, AA = 0.02;
float h(float n) { return fract(sin((n + SD) * 127.1) * 43758.5453); }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float ease(float x) { x = clamp(x, 0.0, 1.0); return 1.0 - pow(1.0 - x, 3.0); }
float sparkle(vec2 q, float s) {   // a four-point star with concave sides
	q = abs(q); float f = sqrt(q.x) + sqrt(q.y), k = sqrt(max(s, 1e-4));
	return 1.0 - smoothstep(k * (1.0 - 0.07), k, f);
}
float diamond(vec2 q, vec2 ab) { return 1.0 - smoothstep(1.0 - 0.12, 1.0, abs(q.x) / ab.x + abs(q.y) / ab.y); }
float ring(float r, float R, float w) { return 1.0 - smoothstep(w - AA, w + AA, abs(r - R)); }

vec3 fx(vec2 p, float t, float tr, vec3 base) {
	float r = length(p), ang = atan(p.y, p.x), after = t - B;
	float scale = 0.7 + 0.35 * tr, dirA = h(3.0) < 0.5 ? -1.0 : 1.0;
	vec3 c0 = base, c1 = mix(base, vec3(1.0), 0.6), c2 = mix(base.brg, vec3(1.0, 0.88, 0.55), 0.45), white = vec3(1.0);
	vec3 e = vec3(0.0);

	// ---- wind-up: a ring closes in, sparkles are drawn in, the badge glows ---------------------------------------------
	if (t < B + 0.03) {
		float k = ease(t / B), fade = 1.0 - smoothstep(B - 0.05, B + 0.03, t);
		e += c1 * ring(r, mix(2.4, 1.08, k), 0.025 + 0.02 * k) * (0.35 + 0.65 * k) * fade;
		for (int i = 0; i < 10; i++) {
			float a = (float(i) + h(float(i))) / 10.0 * TAU + h(60.0) * 6.0, d = mix(2.6 + h(float(i) + 5.0), 1.1, pow(k, 1.6));
			e += mix(c1, white, k) * sparkle(rot(-a) * (p - vec2(cos(a), sin(a)) * d), 0.13 + 0.1 * k) * smoothstep(0.0, 0.25, t) * fade;
		}
		e += c0 * exp(-r * r * 2.2) * k * k * 0.5 * fade;
	}

	if (after > 0.0) {
		// ---- the hit: a flash, and a flare ------------------------------------------------------------------------------
		float flashT = exp(-after * 16.0);
		e += white * (1.0 - smoothstep(0.9 + after * 10.0, 1.2 + after * 10.0, r)) * flashT;
		float fs = (2.2 + 1.2 * scale) * (0.4 + 0.6 * ease(after * 6.0)) * exp(-after * 2.6);
		e += mix(c1, white, 0.5) * (sparkle(p, fs) + 0.6 * sparkle(rot(0.7854) * p, fs * 0.55));
		e += c0 * exp(-r * r * 0.6) * exp(-after * 5.0) * 0.5;

		// ---- the shock ring (Hard and Legendary: two, one behind the other) ---------------------------------------------
		for (int j = 0; j < 2; j++) {
			if (j == 1 && tr < 1.5) break;
			float aj = after - 0.13 * float(j);
			if (aj <= 0.0) continue;
			float kj = ease(aj * 1.9);
			e += (j == 0 ? c1 : c0) * ring(r, 1.0 + (2.3 + 0.9 * scale) * kj, 0.16 * (1.0 - kj) + 0.025) * (1.0 - smoothstep(0.35, 1.0, kj) * 0.85) * exp(-aj * 1.3);
		}

		// ---- the sunburst: wedges turning slowly behind everything (not Easy) --------------------------------------------
		if (tr > 0.5) {
			float K = tr < 1.5 ? 10.0 : tr < 2.5 ? 14.0 : 18.0, x = fract(ang * K / TAU + dirA * after * 0.06);
			float wedge = 1.0 - smoothstep(0.23, 0.27, abs(x - 0.5));
			float reach = 2.6 + 1.3 * scale, rr = smoothstep(1.1, 1.4, r) * (1.0 - smoothstep(reach * 0.3, reach, r));
			e += mix(c0, c1, 0.4) * wedge * rr * (1.0 - exp(-after * 14.0)) * exp(-after * 1.7) * 0.8;
		}

		// ---- the shine, drawn across the badge itself ---------------------------------------------------------------------
		float sp = mix(-1.9, 1.9, ease((after - 0.06) / 0.45)), sd = dot(p, vec2(0.8, 0.6));
		e += white * (1.0 - smoothstep(0.0, 0.22, abs(sd - sp))) * (1.0 - smoothstep(0.95, 1.08, r)) * 0.8 * step(0.0, after - 0.06) * (1.0 - smoothstep(0.5, 0.56, after));

		// ---- runes: a turning ring of ticks round it (Hard and Legendary) ------------------------------------------------
		if (tr > 1.5) {
			for (int j = 0; j < 2; j++) {
				if (j == 1 && tr < 2.5) break;
				float n = j == 0 ? 28.0 : 14.0, R0 = j == 0 ? 1.62 : 2.15, sc = ease(after * 3.0 - 0.1 * float(j));
				float x = fract(ang * n / TAU + (j == 0 ? 1.0 : -1.0) * dirA * after * 0.35), tick = 1.0 - smoothstep(0.18, 0.26, abs(x - 0.5) * (j == 0 ? 1.0 : 0.6));
				float band = (1.0 - smoothstep(0.045, 0.06, abs(r - R0 * (0.7 + 0.3 * sc)))) * tick + ring(r, R0 * (0.7 + 0.3 * sc) + 0.1, 0.012) * 0.9 + ring(r, R0 * (0.7 + 0.3 * sc) - 0.1, 0.012) * 0.9;
				e += mix(c1, white, 0.3) * band * sc * (1.0 - smoothstep(0.7, 1.7, after)) * (j == 0 ? 0.9 : 0.75);
			}
		}

		// ---- Legendary: a beam of light through it, across and up -------------------------------------------------------
		if (tr > 2.5) {
			float g = exp(-after * 2.4) * smoothstep(0.0, 0.05, after);
			e += mix(c1, white, 0.4) * ((1.0 - smoothstep(0.015, 0.06, abs(p.y))) * (1.0 - smoothstep(0.0, 5.5, abs(p.x))) + (1.0 - smoothstep(0.015, 0.05, abs(p.x))) * (1.0 - smoothstep(0.0, 3.0, abs(p.y))) * 0.8) * g;
		}

		// ---- what is thrown out: sparkles, confetti, dots -----------------------------------------------------------------
		float N = tr < 0.5 ? 9.0 : tr < 1.5 ? 15.0 : tr < 2.5 ? 22.0 : 30.0;
		for (int i = 0; i < 30; i++) {
			float fi = float(i);
			if (fi >= N) break;
			float a = (fi + h(fi + 1.0) * 0.8) / N * TAU + h(50.0) * TAU, sp0 = (1.4 + 2.6 * h(fi + 9.0)) * scale, life = 0.8 + 1.0 * h(fi + 19.0);
			float a2 = after - 0.03 * h(fi + 29.0);
			if (a2 < 0.0 || a2 > life) continue;
			float k = a2 / life, fade = 1.0 - smoothstep(0.7, 1.0, k);
			vec2 pos = vec2(cos(a), sin(a)) * (1.15 + sp0 * (1.0 - exp(-a2 * 4.2))) + vec2(0.0, (tr < 0.5 ? 0.5 : -1.5) * a2 * a2 * (0.5 + h(fi + 33.0)));
			vec2 q = p - pos; float type = mod(fi, 3.0), pick = h(fi + 41.0);
			vec3 col = pick < 0.34 ? c0 : pick < 0.62 ? c1 : pick < 0.86 ? c2 : white;
			float v;
			if (type < 0.5) v = sparkle(rot(a2 * 1.5) * q, (0.07 + 0.13 * h(fi + 7.0)) * (1.0 - 0.6 * k) * (0.75 + 0.25 * sin(a2 * 22.0 + fi)));
			else if (type < 1.5) v = diamond(rot(a2 * (3.0 + 5.0 * h(fi + 12.0)) + fi) * q, vec2(0.05 + 0.04 * h(fi + 3.0), 0.12 + 0.06 * h(fi + 4.0)) * (1.0 - 0.3 * k)) * (0.6 + 0.4 * abs(cos(a2 * 9.0 + fi)));
			else v = 1.0 - smoothstep(0.03, 0.05, length(q));
			e += col * v * fade;
		}
	}
	return e;
}
void main() {
	vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uDpr;
	vec3 col = vec3(0.0);
	for (int i = 0; i < ${N}; i++) {
		if (i >= uN) break;
		vec2 p = (px - uC[i]) / uR[i];
		float tr = uTier[i], lim = 4.4 + 1.5 * tr, r = length(p);
		if (uT[i] < 0.0 || uT[i] > 4.0 || r > lim) continue;
		SD = uSeed[i]; AA = 1.0 / (uR[i] * uDpr);
		col += fx(vec2(p.x, -p.y), uT[i], tr, uCol[i]) * smoothstep(lim, lim * 0.8, r);
	}
	col = min(col, vec3(1.0));
	o = vec4(col, max(max(col.r, col.g), col.b));
}`;

const c = document.getElementById('c'), gl = c.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false });
const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG)); gl.linkProgram(prog);
const U = Object.fromEntries(['uRes', 'uDpr', 'uN', 'uC', 'uR', 'uT', 'uSeed', 'uTier', 'uCol'].map((n) => [n, gl.getUniformLocation(prog, n)]));
const vao = gl.createVertexArray(); gl.bindVertexArray(vao); gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'aPos'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

// each unlock: its own seed and a slightly different tone
const jitter = (hex) => {
	const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
	let h = d === 0 ? 0 : mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
	h = (h * 60 + (Math.random() - 0.5) * 50 + 360) % 360;
	const sat = d / (1 - Math.abs(2 * l - 1)), L = Math.min(0.78, Math.max(0.5, l + (Math.random() - 0.5) * 0.12)), cc = (1 - Math.abs(2 * L - 1)) * sat, x = cc * (1 - Math.abs(((h / 60) % 2) - 1)), m = L - cc / 2;
	const [R_, G_, B_] = [[cc, x, 0], [x, cc, 0], [0, cc, x], [0, x, cc], [x, 0, cc], [cc, 0, x]][Math.floor(h / 60) % 6];
	return [R_ + m, G_ + m, B_ + m];
};
const state = TIERS.map((t, i) => ({ at: -1e9, seed: Math.random() * 40, rgb: jitter(t.color) }));
const stage = document.getElementById('stage'), badges = document.getElementById('badges');
TIERS.forEach((t, i) => {
	const left = 190 + i * SPACING - R;
	badges.insertAdjacentHTML('beforeend', `<div class="badge" id="b${i}" style="left:${left}px;--c:${t.color}">${t.icon}</div><div class="lab" style="left:${left + R - 100}px">${t.name} - ${t.sub}</div>`);
});
let frozen = null, playingAll = false;
const play = (i) => { const s = state[i]; s.at = performance.now(); s.seed = Math.random() * 40; s.rgb = jitter(TIERS[i].color); };
document.getElementById('all').onclick = () => { frozen = null; TIERS.forEach((_, i) => play(i)); };
document.querySelectorAll('button[data-i]').forEach((b) => { b.onclick = () => { frozen = null; play(Number(b.dataset.i)); }; });
const sc = document.getElementById('sc'), tt = document.getElementById('tt');
sc.oninput = () => { frozen = sc.value / 10; };
function frame(now) {
	requestAnimationFrame(frame);
	const dpr = Math.min(2, devicePixelRatio || 1), w = Math.round(c.clientWidth * dpr), h = Math.round(c.clientHeight * dpr);
	if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
	const C = new Float32Array(N * 2), Rr = new Float32Array(N), T = new Float32Array(N), S = new Float32Array(N), Tr = new Float32Array(N), K = new Float32Array(N * 3);
	if (!frozen && document.getElementById('loop').checked && state.every((s) => now - s.at > 6200)) TIERS.forEach((_, i) => play(i));
	state.forEach((s, i) => {
		const el = document.getElementById('b' + i), r = el.getBoundingClientRect(), cr = c.getBoundingClientRect();
		C[i * 2] = r.left + r.width / 2 - cr.left; C[i * 2 + 1] = r.top + r.height / 2 - cr.top; Rr[i] = R;
		const t = frozen != null ? frozen : (now - s.at) / 1000; T[i] = t; S[i] = s.seed; Tr[i] = i; K.set(s.rgb, i * 3);
		el.style.setProperty('--s', String(t < 0 ? 1 : t < 0.7 ? 1 - 0.18 * Math.sin((t / 0.7) * Math.PI / 2) : 1 + 0.38 * Math.exp(-(t - 0.7) * 6.5) * Math.cos((t - 0.7) * 11)));
		el.style.opacity = t < 0 ? 1 : '1';
	});
	if (frozen != null) tt.textContent = `t = ${frozen.toFixed(1)}s`; else tt.textContent = '';
	gl.viewport(0, 0, c.width, c.height); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.useProgram(prog);
	gl.uniform2f(U.uRes, c.width, c.height); gl.uniform1f(U.uDpr, c.width / c.clientWidth); gl.uniform1i(U.uN, N);
	gl.uniform2fv(U.uC, C); gl.uniform1fv(U.uR, Rr); gl.uniform1fv(U.uT, T); gl.uniform1fv(U.uSeed, S); gl.uniform1fv(U.uTier, Tr); gl.uniform3fv(U.uCol, K);
	gl.bindVertexArray(vao); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(frame);
window.__fx = { state, setT: (t) => { frozen = t; } };
</script>
