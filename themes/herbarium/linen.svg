<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'>
  <!-- Bookcloth: a fine plain weave (warp threads light, weft threads in
       shadow, three pixels apart), the cloth's slight unevenness as a large
       soft mottle, and the odd thicker thread. -->
  <defs>
    <pattern id='weave' width='3' height='3' patternUnits='userSpaceOnUse'>
      <rect width='3' height='1.4' fill='#fff' fill-opacity='.045'/>
      <rect width='1.4' height='3' fill='#000' fill-opacity='.07'/>
    </pattern>
    <filter id='mottle' x='0' y='0' width='100%' height='100%'>
      <feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='3' seed='4' stitchTiles='stitch'/>
      <feColorMatrix values='0 0 0 0 .85  0 0 0 0 .9  0 0 0 0 .78  0 0 0 -.9 .5'/>
    </filter>
    <filter id='slub' x='0' y='0' width='100%' height='100%'>
      <feTurbulence type='fractalNoise' baseFrequency='.004 .55' numOctaves='2' seed='11' stitchTiles='stitch'/>
      <feColorMatrix values='0 0 0 0 .86  0 0 0 0 .9  0 0 0 0 .8  0 0 0 3.2 -2.05'/>
    </filter>
  </defs>
  <rect width='240' height='240' filter='url(#mottle)' opacity='.16'/>
  <rect width='240' height='240' fill='url(#weave)'/>
  <rect width='240' height='240' filter='url(#slub)' opacity='.18'/>
</svg>
