<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'>
  <!-- Cotton rag paper: a soft tooth and the odd long fibre. -->
  <filter id='t' x='0' y='0' width='100%' height='100%'>
    <feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='6' stitchTiles='stitch'/>
    <feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .32  .45 0 0 0 -.2'/>
  </filter>
  <filter id='f' x='0' y='0' width='100%' height='100%'>
    <feTurbulence type='fractalNoise' baseFrequency='.04 .5' numOctaves='2' seed='14' stitchTiles='stitch'/>
    <feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .36  2.2 0 0 0 -1.55'/>
  </filter>
  <rect width='260' height='260' filter='url(#t)'/>
  <rect width='260' height='260' filter='url(#f)' opacity='.6'/>
</svg>
