<svg xmlns='http://www.w3.org/2000/svg' width='800' height='800'>
  <!-- Parchment: broad soft clouds where the skin took the light unevenly,
       a few wider, fainter stains that fade out at their edges, and long
       fibres barely there; all in sepia, laid over the sheet's colour.
       Nothing small enough to read as a speck. -->
  <filter id='cloud' x='0' y='0' width='100%' height='100%'>
    <feTurbulence type='fractalNoise' baseFrequency='.0035' numOctaves='3' seed='21' stitchTiles='stitch'/>
    <feColorMatrix values='0 0 0 0 .55  0 0 0 0 .38  0 0 0 0 .16  0 0 0 -2 1.2'/>
  </filter>
  <filter id='stain' x='0' y='0' width='100%' height='100%'>
    <feTurbulence type='fractalNoise' baseFrequency='.0065' numOctaves='2' seed='5' stitchTiles='stitch'/>
    <feColorMatrix values='0 0 0 0 .5  0 0 0 0 .32  0 0 0 0 .12  0 0 0 -2.6 1.25'/>
  </filter>
  <filter id='fibre' x='0' y='0' width='100%' height='100%'>
    <feTurbulence type='fractalNoise' baseFrequency='.012 .3' numOctaves='2' seed='8' stitchTiles='stitch'/>
    <feColorMatrix values='0 0 0 0 .45  0 0 0 0 .34  0 0 0 0 .2  1.6 0 0 0 -1.05'/>
  </filter>
  <rect width='800' height='800' filter='url(#cloud)' opacity='.2'/>
  <rect width='800' height='800' filter='url(#stain)' opacity='.1'/>
  <rect width='800' height='800' filter='url(#fibre)' opacity='.25'/>
</svg>
