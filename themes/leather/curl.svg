<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'>
  <!-- The page's bottom-right corner, curling up. The page now ends at the
       fold, a curve from R (100,20) to B (20,100) that scoops in towards the
       page; past it lies the sheet beneath, in the flap's shadow. The flap
       rolls up over the page to a tip at T (40,30): lit like a cylinder,
       shaded at the crease, bright across its middle, greying at the tip,
       with a fine bright edge, and it casts a soft shadow both onto the page
       round it and onto the sheet beneath. -->
  <defs>
    <linearGradient id='under' gradientUnits='userSpaceOnUse' x1='52' y1='52' x2='100' y2='100'>
      <stop offset='0' stop-color='#bdbcb5'/>
      <stop offset='.3' stop-color='#d9d8d2'/>
      <stop offset='1' stop-color='#ebeae5'/>
    </linearGradient>
    <linearGradient id='flap' gradientUnits='userSpaceOnUse' x1='56' y1='56' x2='38' y2='33'>
      <stop offset='0' stop-color='#c3c2bb'/>
      <stop offset='.18' stop-color='#e6e5e0'/>
      <stop offset='.55' stop-color='#fdfdfb'/>
      <stop offset='.85' stop-color='#f1f0ec'/>
      <stop offset='1' stop-color='#d6d5cf'/>
    </linearGradient>
    <clipPath id='beneath'>
      <path d='M20 100Q46 46 100 20V100Z'/>
    </clipPath>
    <filter id='soft' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur stdDeviation='2.4'/>
    </filter>
    <filter id='wide' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur stdDeviation='5'/>
    </filter>
    <path id='flap-shape' d='M100 20C80 26 56 28 40 30C36 52 30 78 20 100Q46 46 100 20Z'/>
  </defs>
  <!-- the sheet beneath, where the page has lifted away -->
  <path d='M20 100Q46 46 100 20V100Z' fill='url(#under)'/>
  <!-- the flap's shadow on that sheet, thrown down and right -->
  <g clip-path='url(#beneath)'>
    <use href='#flap-shape' fill='#000' fill-opacity='.38' filter='url(#wide)' transform='translate(7 7)'/>
  </g>
  <!-- its shadow on the page, round its rolled edges -->
  <use href='#flap-shape' fill='#000' fill-opacity='.22' filter='url(#soft)' transform='translate(-2 -1)'/>
  <!-- the flap -->
  <use href='#flap-shape' fill='url(#flap)'/>
  <path d='M100 20C80 26 56 28 40 30C36 52 30 78 20 100' fill='none' stroke='#fff' stroke-width='.8'/>
  <path d='M20 100Q46 46 100 20' fill='none' stroke='#a9a8a0' stroke-opacity='.8' stroke-width='.6'/>
</svg>
